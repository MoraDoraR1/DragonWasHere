<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- ── DWH Analytics: Firebase(GA4) 연결 ── -->
    <script src="firebase-config.js"></script>
    <script>
      // Unity가 Firebase 로딩보다 먼저 이벤트를 보내도 잃지 않도록 큐에 쌓아 둔다.
      window.DwhAnalyticsBridge = (function () {
        var queue = [], impl = null;
        function call(method, args) {
          if (impl) impl[method].apply(null, args);
          else queue.push([method, args]);
        }
        return {
          init: function () { call("init", arguments); },
          log: function () { call("log", arguments); },
          setUserProps: function () { call("setUserProps", arguments); },
          // 게임이 보내는 지금 화면 + 공통 파라미터. page_exit에 쓴다.
          setContext: function (ctx) { exitTracker.context = ctx || {}; },
          _attach: function (i) {
            impl = i;
            for (var k = 0; k < queue.length; k++) impl[queue[k][0]].apply(null, queue[k][1]);
            queue = [];
          },
          _call: call
        };
      })();

      // ── 이탈 추적 ──
      // 브라우저는 떠나는 순간 새로고침·탭 닫기·다른 사이트 이동을 구분해 주지 않는다(모두 pagehide).
      // 그래서 (1) 떠날 때 page_exit를 보내고 시각을 남기고, (2) 다음 실행의 game_session_start에
      // 직전 이탈과의 간격(return_gap_sec)과 분류(return_type: first / quick(60초 안, 새로고침 추정) / later)를 붙인다.
      // itch는 게임을 iframe으로 띄워 navigation type이 늘 "navigate"라서 reload 판정을 쓸 수 없다.
      var exitTracker = (function () {
        var KEY = "dwh_last_exit", QUICK_SEC = 60;
        var loadedAt = Date.now();
        var last = null;
        try { last = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
        var sent = false;

        function remember(reason) {
          try {
            var ctx = tracker.context || {};
            localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), scene: ctx.scene || "title", reason: reason }));
          } catch (e) {}
        }

        var tracker = {
          context: {},
          // game_session_start에 붙일 직전 이탈 정보
          returnInfo: function () {
            if (!last || !last.t) return { return_type: "first", return_gap_sec: -1, prev_exit_scene: "" };
            var gap = Math.max(0, Math.round((loadedAt - last.t) / 1000));
            return { return_type: gap <= QUICK_SEC ? "quick" : "later", return_gap_sec: gap, prev_exit_scene: last.scene || "" };
          },
          exit: function (persisted) {
            remember("pagehide");
            if (sent) return;
            sent = true;
            var p = {};
            var ctx = tracker.context || {};
            for (var k in ctx) p[k] = ctx[k];
            if (!p.scene) p.scene = "title";
            p.session_sec = Math.round((Date.now() - loadedAt) / 1000);
            p.persisted = persisted ? 1 : 0;
            window.DwhAnalyticsBridge._call("log", ["page_exit", p]);
          }
        };

        // 모바일은 pagehide가 빠질 수 있어 hidden이 될 때 시각만 먼저 남긴다(복귀 간격 계산용).
        document.addEventListener("visibilitychange", function () {
          // 떠날 때는 pagehide 다음에 hidden이 오므로, 이미 page_exit를 보냈으면 덮어쓰지 않는다.
          if (document.visibilityState === "hidden" && !sent) remember("hidden");
        });
        addEventListener("pagehide", function (e) { tracker.exit(e.persisted); });
        // 뒤로 가기 캐시(bfcache)에서 되살아나면 다음 이탈도 다시 보낸다.
        addEventListener("pageshow", function (e) { if (e.persisted) sent = false; });
        return tracker;
      })();
    </script>
    <script type="module">
      const FIREBASE_VERSION = "10.12.2";
      const consoleOnly = {
        init(uid, props, isDev) { console.log("[DWH] init (콘솔 전용)", uid, props, isDev); },
        log(name, params) {
          if (name === "game_session_start") Object.assign(params, exitTracker.returnInfo());
          console.log("[DWH]", name, params);
        },
        setUserProps(props) { console.log("[DWH] user props", props); }
      };
      const bridge = window.DwhAnalyticsBridge;
      const cfg = window.DWH_FIREBASE_CONFIG;

      if (!cfg) {
        console.warn("[DWH] firebase-config.js가 비어 있어 콘솔에만 기록합니다.");
        bridge._attach(consoleOnly);
      } else {
        try {
          const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
          const { initializeApp } = await import(`${base}/firebase-app.js`);
          const fa = await import(`${base}/firebase-analytics.js`);
          if (!(await fa.isSupported())) throw new Error("이 브라우저 환경은 Firebase Analytics를 지원하지 않음");

          const app = initializeApp(cfg);
          // itch.io는 게임을 다른 도메인의 iframe에서 띄우므로 쿠키를 SameSite=None으로 둔다.
          const analytics = fa.initializeAnalytics(app, {
            config: { cookie_flags: "SameSite=None;Secure", send_page_view: false }
          });

          let isDev = false;
          bridge._attach({
            init(uid, props, dev) {
              isDev = !!dev;
              fa.setUserId(analytics, uid);
              fa.setUserProperties(analytics, props);
              console.log("[DWH] Firebase 연결됨", { uid, dev: isDev });
            },
            log(name, params) {
              if (name === "game_session_start") Object.assign(params, exitTracker.returnInfo());
              // debug_mode가 붙은 이벤트만 GA4 DebugView에 실시간으로 보인다.
              if (isDev) params.debug_mode = true;
              fa.logEvent(analytics, name, params);
              if (isDev) console.log("[DWH]", name, params);
            },
            setUserProps(props) { fa.setUserProperties(analytics, props); }
          });
        } catch (e) {
          console.warn("[DWH] Firebase 연결 실패, 콘솔에만 기록합니다:", e);
          bridge._attach(consoleOnly);
        }
      }
    </script>
    <!-- ── /DWH Analytics ── -->
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // 세이브(PlayerPrefs 외 파일)가 새로고침 뒤에도 남도록 한다.
      config.autoSyncPersistentDataPath = true;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      // ── 이전 빌드 진행 옮기기 (10-13) ──
      // 게임은 진행(DWH.Save)과 지표 값(dwh.*: 사용자 ID·세션 번호·플레이 시간·카운터)을 localStorage "DragonWasHere.<키>"에 둔다
      // (도메인 단위라 주소가 바뀌어도 남음). 그 전 빌드(Ver03까지)는 PlayerPrefs에만 저장했는데, 웹 PlayerPrefs는 IndexedDB
      // "/idbfs/<페이지 주소 해시>/PlayerPrefs"라 itch에 새로 올려 주소가 바뀌면 못 읽는다. localStorage에 없는 키는
      // 같은 도메인의 모든 PlayerPrefs 파일에서 가장 최근 값을 찾아 옮긴 뒤 게임을 띄운다.
      var DWH_LOCAL_PREFIX = "DragonWasHere.";
      // Unity PlayerPrefs 파일: "UnityPrf" + 8바이트, 항목 = 키(길이 1바이트, 0x80이면 int32 길이) + 값
      // (0xFD float32, 0xFE int32, 그 밖은 문자열 길이 1바이트, 0x80이면 int32 길이)
      function dwhParsePrefs(contents) {
        var b = new Uint8Array(contents), dv = new DataView(b.buffer, b.byteOffset, b.byteLength), dec = new TextDecoder("utf-8");
        var out = {}, p = 16;
        if (b.length < 16 || dec.decode(b.subarray(0, 8)) !== "UnityPrf") return out;
        while (p < b.length) {
          var kl = b[p++];
          if (kl === 0) break;
          if (kl === 0x80) { kl = dv.getInt32(p, true); p += 4; }
          if (kl <= 0 || p + kl > b.length) break;
          var key = dec.decode(b.subarray(p, p + kl)); p += kl;
          var t = b[p++], value;
          if (t === 0xFD) { value = dv.getFloat32(p, true); p += 4; }
          else if (t === 0xFE) { value = dv.getInt32(p, true); p += 4; }
          else {
            var len = t;
            if (t === 0x80) { len = dv.getInt32(p, true); p += 4; }
            if (len < 0 || p + len > b.length) break;
            value = dec.decode(b.subarray(p, p + len)); p += len;
          }
          out[key] = value;
        }
        return out;
      }
      function dwhRecoverSave() {
        return new Promise(function (resolve) {
          try {
            if (localStorage.getItem(DWH_LOCAL_PREFIX + "DWH.Save")) return resolve();
            var req = indexedDB.open("/idbfs");
            req.onupgradeneeded = function (e) { e.target.transaction.abort(); };   // 없던 DB는 만들지 않는다
            req.onerror = function () { resolve(); };
            req.onsuccess = function () {
              var db = req.result, files = [];
              if (!db.objectStoreNames.contains("FILE_DATA")) { db.close(); return resolve(); }
              var cursor = db.transaction("FILE_DATA").objectStore("FILE_DATA").openCursor();
              cursor.onsuccess = function (e) {
                var c = e.target.result;
                if (c) {
                  if (/\/PlayerPrefs$/.test(c.key) && c.value && c.value.contents) {
                    try { files.push({ time: +c.value.timestamp || 0, prefs: dwhParsePrefs(c.value.contents) }); } catch (err) {}
                  }
                  c.continue();
                  return;
                }
                db.close();
                files.sort(function (a, b) { return a.time - b.time; });   // 최근 파일이 마지막에 덮어쓴다
                var found = {};
                files.forEach(function (f) {
                  for (var key in f.prefs) if (key === "DWH.Save" || key.indexOf("dwh.") === 0) found[key] = f.prefs[key];
                });
                var moved = 0;
                for (var key in found) {
                  if (localStorage.getItem(DWH_LOCAL_PREFIX + key) === null) { localStorage.setItem(DWH_LOCAL_PREFIX + key, String(found[key])); moved++; }
                }
                if (moved) console.log("[DWH] 이전 빌드 진행을 옮겼습니다 (" + moved + "개)");
                resolve();
              };
              cursor.onerror = function () { db.close(); resolve(); };
            };
          } catch (e) { resolve(); }
        });
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      // 진행 옮기기가 끝나면(최대 3초) 게임을 띄운다
      Promise.race([dwhRecoverSave(), new Promise(function (r) { setTimeout(r, 3000); })])
        .then(function () { document.body.appendChild(script); });
    </script>
  </body>
</html>
